# AI Models Configuration
# This file defines available LLM models and their settings
# Can be overridden by external config at EXTERNAL_AI_CONFIG_PATH

version: "1.0.0"

# Default model to use
default_model: gpt-oss-120b

# Available models on Groq. Llama 3.x, Kimi K2 and Qwen 32B were shut down by
# Groq (see console.groq.com/docs/deprecations); AIService maps their old keys
# to these replacements.
models:
  gpt-oss-120b:
    id: openai/gpt-oss-120b
    name: "GPT-OSS 120B"
    description: "OpenAI open-weight, strong reasoning and code"
    provider: groq
    context_window: 131072
    max_tokens: 8192
    settings:
      temperature: 0.5
      top_p: 1.0
    pricing:
      input: 0.15   # per 1M tokens
      output: 0.60  # per 1M tokens
    use_cases:
      - general
      - chat
      - coding
      - code_review
      - reasoning
      - long_context
      - agentic

  gpt-oss-20b:
    id: openai/gpt-oss-20b
    name: "GPT-OSS 20B"
    description: "OpenAI open-weight, fast and lightweight"
    provider: groq
    context_window: 131072
    max_tokens: 4096
    settings:
      temperature: 0.5
      top_p: 1.0
    pricing:
      input: 0.075  # per 1M tokens
      output: 0.30  # per 1M tokens
    use_cases:
      - simple_tasks
      - fast_inference
      - cost_sensitive

# Task-specific model recommendations
task_defaults:
  coding:
    primary: gpt-oss-120b
    fallback: gpt-oss-20b
  code_review:
    primary: gpt-oss-120b
    fallback: gpt-oss-20b
  contract_analysis:
    primary: gpt-oss-120b
    fallback: gpt-oss-20b
  chat:
    primary: gpt-oss-120b
    fallback: gpt-oss-20b
  commit_message:
    primary: gpt-oss-20b
    fallback: gpt-oss-120b
  long_context:
    primary: gpt-oss-120b
    fallback: gpt-oss-20b
  agentic:
    primary: gpt-oss-120b
    fallback: gpt-oss-20b

# Provider configurations
providers:
  groq:
    name: "Groq"
    base_url: "https://api.groq.com/openai/v1"
    env_key: "GROQ_API_KEY"
    credential_key: "groqApiKey"
    rate_limits:
      requests_per_minute: 30
      tokens_per_minute: 100000
