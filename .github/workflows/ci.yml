name: CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # --ignore-scripts skips postinstall (electron-builder install-app-deps)
        # CI tests run in Node.js, not Electron — no native rebuild needed
        run: npm ci --ignore-scripts

      # ...but several suites still import electron transitively: DatabaseService
      # does `import { app } from 'electron'`, and with --ignore-scripts that
      # module throws "Electron failed to install correctly" the moment it is
      # required, taking four suites down at load time. Fetching just the binary
      # makes the import resolve, as it does locally; the module then exports a
      # path string outside an Electron runtime, which is exactly what those
      # tests already tolerate. Far cheaper than the full postinstall rebuild.
      - name: Install Electron binary
        run: node node_modules/electron/install.js

      # The TypeScript suite (jest.kanvas.config.cjs): ~150 suites over
      # electron/, shared/ and renderer/. This one gates the build.
      #
      # `npm test` uses the default jest config, whose testMatch only matches
      # *.test.js, so it never saw a single one of these files. Combined with
      # continue-on-error below, CI could not fail on a broken test at all.
      - name: Run Tests
        run: npm run test:kanvas

      # Legacy JavaScript suites under test_cases/ and tests/. 15 of their 19
      # files currently fail at module load on main, so this cannot gate yet.
      # It stays visible, and non-blocking, until they are fixed or retired —
      # making it blocking today would just wall off main.
      - name: Run Legacy JS Tests (non-blocking)
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build
